<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-label="How Consequences works: a scripted gate before handoff, then a learning loop and optional strike ladder if a defect still reaches the owner.">
  <title>How Consequences works</title>
  <rect width="1280" height="860" fill="#0B0D10"/>
  <style>
    .t { font-family: "Instrument Sans", Inter, ui-sans-serif, sans-serif; }
  </style>
  <text class="t" x="40" y="48" fill="#EEF1F4" font-size="22" font-weight="600">How Consequences works</text>
  <text class="t" x="1240" y="46" fill="#8B939E" font-size="13" text-anchor="end">A scripted gate, then a learning loop when a miss still reaches the owner.</text>

  <!-- Band 1: before handoff -->
  <rect x="40" y="68" width="1200" height="200" fill="#101317" stroke="#1C2128"/>
  <text class="t" x="62" y="96" fill="#4D8DFF" font-size="11" font-weight="650" letter-spacing="1.8">BEFORE HANDOFF</text>

  <rect x="62" y="114" width="250" height="96" fill="#171B21" stroke="#2A3038"/>
  <text class="t" x="78" y="144" fill="#EEF1F4" font-size="15" font-weight="600">Agent finishes work</text>
  <text class="t" x="78" y="166" fill="#8B939E" font-size="12">The deliverable is built: the file, app,</text>
  <text class="t" x="78" y="182" fill="#8B939E" font-size="12">image or page the owner will actually use.</text>

  <path d="M322 162h28m-6-5l8 5-8 5" fill="none" stroke="#4D8DFF" stroke-width="1.5"/>

  <rect x="360" y="114" width="250" height="96" fill="#171B21" stroke="#2A3038"/>
  <text class="t" x="376" y="144" fill="#EEF1F4" font-size="15" font-weight="600">ship-gate script runs</text>
  <text class="t" x="376" y="166" fill="#8B939E" font-size="12">Artifact, secrets, references, smoke</text>
  <text class="t" x="376" y="182" fill="#8B939E" font-size="12">test, checklist, and a SHA-256.</text>

  <path d="M620 162h28m-6-5l8 5-8 5" fill="none" stroke="#4D8DFF" stroke-width="1.5"/>

  <rect x="658" y="114" width="148" height="96" fill="#132033" stroke="#2C4A7A"/>
  <text class="t" x="732" y="168" fill="#8CB4FF" font-size="14" font-weight="600" text-anchor="middle">Pass X/X?</text>

  <text class="t" x="830" y="132" fill="#5BD38A" font-size="10" font-weight="650" letter-spacing="0.8">YES</text>
  <path d="M816 162h28m-6-5l8 5-8 5" fill="none" stroke="#5BD38A" stroke-width="1.5"/>

  <rect x="854" y="114" width="362" height="96" fill="#102018" stroke="#2A5A40"/>
  <text class="t" x="870" y="144" fill="#5BD38A" font-size="15" font-weight="600">Hand to the owner</text>
  <text class="t" x="870" y="166" fill="#8B939E" font-size="12">Filename, hash, pass count, exit code, and a</text>
  <text class="t" x="870" y="182" fill="#8B939E" font-size="12">screenshot path when it applies.</text>

  <text class="t" x="62" y="242" fill="#E0B15C" font-size="13" font-weight="600">No:</text>
  <text class="t" x="90" y="242" fill="#8B939E" font-size="13">not ready. Keep fixing and run the gate again. A failed gate is not a strike.</text>

  <!-- Band 2 -->
  <rect x="40" y="284" width="1200" height="186" fill="#101317" stroke="#1C2128"/>
  <text class="t" x="62" y="312" fill="#4D8DFF" font-size="11" font-weight="650" letter-spacing="1.8">IF A DEFECT STILL REACHES THE OWNER</text>

  <rect x="62" y="330" width="250" height="116" fill="#171B21" stroke="#2A3038"/>
  <text class="t" x="78" y="360" fill="#EEF1F4" font-size="15" font-weight="600">Own it in one line</text>
  <text class="t" x="78" y="382" fill="#8B939E" font-size="12">What broke, and why the gate</text>
  <text class="t" x="78" y="398" fill="#8B939E" font-size="12">missed it.</text>

  <path d="M322 388h28m-6-5l8 5-8 5" fill="none" stroke="#4D8DFF" stroke-width="1.5"/>

  <rect x="360" y="330" width="250" height="116" fill="#171B21" stroke="#2A3038"/>
  <text class="t" x="376" y="360" fill="#EEF1F4" font-size="15" font-weight="600">Fix the artifact and the gate</text>
  <text class="t" x="376" y="382" fill="#8B939E" font-size="12">The same pass should make the</text>
  <text class="t" x="376" y="398" fill="#8B939E" font-size="12">gate catch this next time.</text>

  <path d="M620 388h28m-6-5l8 5-8 5" fill="none" stroke="#4D8DFF" stroke-width="1.5"/>

  <rect x="658" y="330" width="250" height="116" fill="#171B21" stroke="#2A3038"/>
  <text class="t" x="674" y="360" fill="#EEF1F4" font-size="15" font-weight="600">Add one checklist line</text>
  <text class="t" x="674" y="382" fill="#8B939E" font-size="12">The lesson is now a permanent</text>
  <text class="t" x="674" y="398" fill="#8B939E" font-size="12">check for that deliverable type.</text>

  <path d="M918 388h28m-6-5l8 5-8 5" fill="none" stroke="#4D8DFF" stroke-width="1.5"/>

  <rect x="956" y="330" width="260" height="116" fill="#171B21" stroke="#2A3038"/>
  <text class="t" x="972" y="360" fill="#EEF1F4" font-size="15" font-weight="600">Log a strike</text>
  <text class="t" x="972" y="382" fill="#8B939E" font-size="12">Write the miss in STRIKES.md,</text>
  <text class="t" x="972" y="398" fill="#8B939E" font-size="12">then apply the ladder.</text>

  <!-- Band 3: ladder -->
  <rect x="40" y="486" width="1200" height="246" fill="#101317" stroke="#1C2128"/>
  <text class="t" x="62" y="514" fill="#4D8DFF" font-size="11" font-weight="650" letter-spacing="1.8">OPTIONAL ADD-ON · THE CONSEQUENCES LADDER</text>

  <rect x="62" y="532" width="276" height="172" fill="#171B21" stroke="#5A4220"/>
  <text class="t" x="78" y="558" fill="#4D8DFF" font-size="11" font-weight="650" letter-spacing="1.5">1 STRIKE</text>
  <text class="t" x="78" y="584" fill="#EEF1F4" font-size="16" font-weight="600">Warning</text>
  <text class="t" x="78" y="610" fill="#8B939E" font-size="12">Own it, fix artifact and gate,</text>
  <text class="t" x="78" y="626" fill="#8B939E" font-size="12">add a checklist line.</text>

  <rect x="354" y="532" width="276" height="172" fill="#171B21" stroke="#5A4A20"/>
  <text class="t" x="370" y="558" fill="#4D8DFF" font-size="11" font-weight="650" letter-spacing="1.5">2 STRIKES</text>
  <text class="t" x="370" y="584" fill="#EEF1F4" font-size="16" font-weight="600">Probation</text>
  <text class="t" x="370" y="610" fill="#8B939E" font-size="12">Every handoff attaches full gate</text>
  <text class="t" x="370" y="626" fill="#8B939E" font-size="12">proof. No "done" until the owner</text>
  <text class="t" x="370" y="642" fill="#8B939E" font-size="12">sees it.</text>

  <rect x="646" y="532" width="276" height="172" fill="#171B21" stroke="#2C4A7A"/>
  <text class="t" x="662" y="558" fill="#4D8DFF" font-size="11" font-weight="650" letter-spacing="1.5">3 STRIKES</text>
  <text class="t" x="662" y="584" fill="#EEF1F4" font-size="16" font-weight="600">Reassigned</text>
  <text class="t" x="662" y="610" fill="#8B939E" font-size="12">Work moves to another agent or</text>
  <text class="t" x="662" y="626" fill="#8B939E" font-size="12">a stronger model.</text>

  <rect x="938" y="532" width="278" height="172" fill="#171B21" stroke="#6A3038"/>
  <text class="t" x="954" y="558" fill="#4D8DFF" font-size="11" font-weight="650" letter-spacing="1.5">4+ STRIKES</text>
  <text class="t" x="954" y="584" fill="#FF8B96" font-size="16" font-weight="600">Fired</text>
  <text class="t" x="954" y="610" fill="#8B939E" font-size="12">The agent is removed. The lessons</text>
  <text class="t" x="954" y="626" fill="#8B939E" font-size="12">stay in the checklist.</text>

  <text class="t" x="40" y="764" fill="#8B939E" font-size="12">The core skill leaves the consequence to the owner and does not name it in advance. The strike log and ladder live in the optional strike-ladder add-on.</text>
  <text class="t" x="40" y="784" fill="#8B939E" font-size="12">Same-class repeats count double. Ten clean gated handoffs clear one strike. Rolling 30-day window. The owner can skip or override any step.</text>
</svg>
