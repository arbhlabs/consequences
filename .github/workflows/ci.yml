name: Consequences CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Validate shell scripts
        run: shellcheck install.sh templates/gate.sh tests/test-gate.sh
      - name: Run regression tests
        run: bash tests/test-gate.sh
      - name: Run packaged handoff example
        run: bash examples/package-demo.sh
  points-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/test-points.mjs
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tests/test-install.ps1
          ./examples/points-demo.ps1
