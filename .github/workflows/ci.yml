name: Consequences CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Validate shell scripts
        run: shellcheck install.sh templates/gate.sh tests/test-gate.sh
      - name: Run regression tests
        run: bash tests/test-gate.sh

  brain-tests:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Consequences Brain tests (no window is opened)
        run: python -m unittest discover -s addons/brain/tests -v
